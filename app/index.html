<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>Nebula</title>
    <style>
      html,
      body {
        margin: 0;
        background: #0b1020;
      }
    </style>
  </head>
  <body>
    <!-- 启动页:首屏即绘制(不等 JS/React),挂载完成后由 main.tsx 淡出移除,避免打开时一片空白。 -->
    <div id="splash">
      <img src="/logo.svg" alt="Nebula" width="88" height="88" />
      <div id="splash-name">Nebula</div>
      <div id="splash-bar"><span></span></div>
    </div>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: #0b1020;
        color: #c7d2fe;
        font-family: -apple-system, "PingFang SC", "Helvetica Neue", Arial, sans-serif;
        transition: opacity 0.35s ease;
      }
      #splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        filter: drop-shadow(0 8px 28px rgba(91, 140, 255, 0.35));
        animation: splash-pulse 1.6s ease-in-out infinite;
      }
      #splash-name {
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 0.5px;
        background: linear-gradient(90deg, #fff, #c7d2fe);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      #splash-bar {
        width: 140px;
        height: 3px;
        border-radius: 2px;
        background: rgba(255, 255, 255, 0.12);
        overflow: hidden;
      }
      #splash-bar span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 2px;
        background: linear-gradient(90deg, #5b8cff, #8b5cf6);
        animation: splash-slide 1.1s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: 0.85; }
      }
      @keyframes splash-slide {
        0% { transform: translateX(-120%); }
        100% { transform: translateX(350%); }
      }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
