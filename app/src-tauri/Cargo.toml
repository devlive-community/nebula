[package]
name = "nebula-app"
version = "1.8.0"
description = "Nebula multi-cloud storage manager (Tauri desktop app)"
edition = "2021"
publish = false

[lib]
name = "nebula_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread"] }
futures = "0.3"
bytes = "1"
app-core = { path = "../../crates/app-core" }
nebula-provider = { path = "../../crates/nebula-provider" }

# 独立于根 workspace 构建
[workspace]
