[package]
name = "app-core"
version.workspace = true
description = "Framework-agnostic Nebula app logic over the provider registry (used by the Tauri shell)"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[dependencies]
nebula-provider = { path = "../nebula-provider" }
provider-aliyun = { path = "../providers/provider-aliyun" }
provider-tencent = { path = "../providers/provider-tencent" }
provider-huawei = { path = "../providers/provider-huawei" }
provider-qiniu = { path = "../providers/provider-qiniu" }
provider-aws = { path = "../providers/provider-aws" }
provider-r2 = { path = "../providers/provider-r2" }
provider-minio = { path = "../providers/provider-minio" }
bytes = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rusqlite = { version = "0.32", features = ["bundled"] }
# 各平台原生后端:macOS Keychain / Windows Credential / Linux 内核 keyutils
# (linux-native 为纯 Rust,不依赖 libdbus / openssl 等系统库,CI 可直接编译)。
keyring = { version = "3", default-features = false, features = [
    "apple-native",
    "windows-native",
    "linux-native",
] }

[dev-dependencies]
tokio = { workspace = true }
async-trait = "0.1"
futures = { workspace = true }
