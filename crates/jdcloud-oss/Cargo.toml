[package]
name = "jdcloud-oss"
version.workspace = true
description = "Hand-written async Rust SDK for JD Cloud Object Storage Service (S3-Compatible API), a thin facade over s3-core"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["jdcloud", "oss", "object-storage", "sigv4"]
categories = ["api-bindings"]

[dependencies]
s3-core = { path = "../s3-core", version = "1" }

[dev-dependencies]
tokio = { workspace = true }
futures = { workspace = true }
