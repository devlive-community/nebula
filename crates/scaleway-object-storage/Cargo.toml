[package]
name = "scaleway-object-storage"
version.workspace = true
description = "Hand-written async Rust SDK for Scaleway Object Storage (S3-Compatible API), a thin facade over s3-core"
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords = ["scaleway", "s3", "object-storage", "sigv4"]
categories = ["api-bindings"]

[dependencies]
s3-core = { path = "../s3-core", version = "1" }

[dev-dependencies]
tokio = { workspace = true }
futures = { workspace = true }
